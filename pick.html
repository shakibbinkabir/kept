<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose what to export · Kept</title>
  <link rel="icon" href="icons/icon32.png" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/pick.css" />
</head>
<body>
  <header class="top">
    <svg class="logo" viewBox="0 0 256 256" aria-hidden="true"><use href="icons/ui.svg#mark" /></svg>
    <div class="who">
      <h1 id="title" data-i18n="chooseTitle">Choose what to export</h1>
      <p id="sub" data-i18n="loading">Loading…</p>
    </div>
    <div class="segmented" role="radiogroup" aria-label="What to list" data-i18n-aria="whatToList">
      <label><input type="radio" name="mode" value="posts" checked /> <span data-i18n="listPosts">Posts</span></label>
      <label><input type="radio" name="mode" value="images" /> <span data-i18n="listImages">Images</span></label>
      <label><input type="radio" name="mode" value="reels" /> <span data-i18n="listReels">Reels</span></label>
      <label><input type="radio" name="mode" value="highlights" /> <span data-i18n="listHighlights">Highlights</span></label>
    </div>
  </header>

  <div class="tools">
    <p class="status" id="status" aria-live="polite"></p>
    <button id="stopBtn" class="btn-ghost" hidden data-i18n="stopLoading">Stop loading</button>
    <button id="allBtn" class="btn-ghost" data-i18n="selectAll">Select all</button>
    <button id="noneBtn" class="btn-ghost" data-i18n="selectNone">Select none</button>
  </div>

  <main>
    <p class="tip" data-i18n="pickTip">Tick what you want. Shift-click selects everything between two ticks.</p>
    <ul class="grid" id="grid" aria-label="Posts"></ul>
    <ul class="list" id="list" aria-label="Highlights" hidden></ul>
    <div class="empty" id="empty" hidden></div>
  </main>

  <footer class="bar">
    <p id="barText" data-i18n="nothingSelected">Nothing selected</p>
    <div class="bar-actions">
      <button id="showBtn" class="btn-ghost" hidden><svg class="icon" aria-hidden="true"><use href="icons/ui.svg#folder" /></svg><span data-i18n="showInFolder">Show in folder</span></button>
      <button id="exportBtn" class="btn-primary" disabled data-i18n="export">Export</button>
    </div>
  </footer>

  <script src="src/i18n.js"></script>
  <script src="pick.js"></script>
</body>
</html>
